buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jfrog.buildinfo:build-info-extractor-gradle:6.0.4"
  }
}

plugins {
    id 'application'
    id 'com.adarshr.test-logger' version '4.0.0'
    id "org.springframework.boot" version '3.5.16'
    id "org.flywaydb.flyway" version "11.7.2"
}

repositories {
    mavenLocal()
    maven { url = 'https://plugins.gradle.org/m2/' }
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "com.h2database:h2"
    implementation "org.flywaydb:flyway-core"
    implementation "jakarta.xml.bind:jakarta.xml.bind-api"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.assertj:assertj-core"
    testImplementation "nl.jqno.equalsverifier:equalsverifier:4.5.2"
    testImplementation "org.mockito:mockito-core"
    compileOnly "pl.tlinkowski.annotation:pl.tlinkowski.annotation.basic:0.2.0"
}

testlogger {
    theme = 'mocha'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.philips.research.licensescanner.Application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    enabled = false
}

file("src/main/resources/application-db.properties").withReader {
   Properties props = new Properties()
   props.load(it)
   project.ext.ApplicationProps = props
}

flyway {
    url = project.ext.ApplicationProps['spring.datasource.url']
    user = project.ext.ApplicationProps['spring.datasource.username']
    password = project.ext.ApplicationProps['spring.datasource.password']
}

// we need to build classes before we can migrate
flywayMigrate.dependsOn classes

version = '0.6.1'
